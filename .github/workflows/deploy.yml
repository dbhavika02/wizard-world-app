name: Deploy Wizard World App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd /var/www/wizard-world-app

            git pull origin main

            cd backend
            npm install

            pm2 restart wizard-backend

            cd ../frontend

            npm install
            npm run build

            systemctl restart nginx